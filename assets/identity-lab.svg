
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="380"
     viewBox="0 0 1200 380">

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#F2EDE2" stroke-opacity=".09" stroke-width="1"/>
    </pattern>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6457FF"/>
      <stop offset="1" stop-color="#FF5B45"/>
    </linearGradient>

    <clipPath id="panel">
      <rect width="1200" height="380"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <!-- Base -->
    <rect width="1200" height="380" fill="#171719"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- Background geometry -->
    <circle cx="1030" cy="185" r="170" fill="#6457FF" opacity=".17"/>
    <circle cx="1030" cy="185" r="125" fill="none"
            stroke="#D5FF3F" stroke-width="1.5" opacity=".65"/>

    <path d="M850 380L1120 80L1240 210L1110 380Z"
          fill="url(#glow)" opacity=".9"/>

    <path d="M1000 0L1200 0L1200 175Z"
          fill="#D5FF3F"/>

    <path d="M900 0L1060 0L900 160Z"
          fill="#FF5B45"/>

    <!-- Moving signal -->
    <g>
      <rect x="880" y="100" width="12" height="180" fill="#D5FF3F">
        <animate attributeName="y" values="100;120;100"
                 dur="4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="1030" cy="185" r="12" fill="#F2EDE2">
        <animate attributeName="r" values="12;20;12"
                 dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Small technical labels -->
    <g fill="#F2EDE2" font-family="monospace">
      <text x="42" y="42" font-size="11" letter-spacing="3">
        PERSONAL DIGITAL SPACE / 001
      </text>
      <text x="1155" y="42" font-size="10" text-anchor="end">
        EST. 2004
      </text>
      <text x="1155" y="350" font-size="10" text-anchor="end">
        DESIGN IN PROGRESS_
      </text>
    </g>

    <!-- Main typography -->
    <g fill="#F2EDE2" font-family="Arial, Helvetica, sans-serif"
       font-weight="900">
      <text x="52" y="164" font-size="76" letter-spacing="-4">
        GOPALA
      </text>
      <text x="52" y="244" font-size="76" letter-spacing="-4">
        KRISHNA
      </text>
    </g>

    <!-- Accent strip -->
    <rect x="54" y="270" width="58" height="7" fill="#D5FF3F"/>
    <rect x="112" y="270" width="25" height="7" fill="#FF5B45"/>
    <rect x="137" y="270" width="12" height="7" fill="#6457FF"/>

    <g fill="#F2EDE2" font-family="monospace" font-size="12">
      <text x="54" y="310" letter-spacing="2">
        BCA STUDENT / ASPIRING SOFTWARE DEVELOPER
      </text>
      <text x="54" y="338" fill="#D5FF3F">
        BUILDING · LEARNING · EXPERIMENTING
      </text>
    </g>

    <!-- Decorative coordinates -->
    <g fill="#F2EDE2" opacity=".6" font-family="monospace" font-size="9">
      <text x="820" y="330">X: 084 / Y: 021</text>
      <text x="820" y="345">SIGNAL ACTIVE</text>
    </g>

    <!-- Frame details -->
    <path d="M24 58V24H58 M1142 356H1176V322"
          fill="none" stroke="#F2EDE2" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="3" fill="#D5FF3F"/>
    <circle cx="1176" cy="356" r="3" fill="#FF5B45"/>
  </g>
</svg>
