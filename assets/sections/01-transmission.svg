
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" fill="none">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#E9E4D7" stroke-opacity=".055"/>
    </pattern>

    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202127"/>
      <stop offset="1" stop-color="#17181D"/>
    </linearGradient>

    <linearGradient id="beam" x1="700" y1="40" x2="950" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B88BEA"/>
      <stop offset=".5" stop-color="#F15A3B"/>
      <stop offset="1" stop-color="#D9F04A"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9F04A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#D9F04A"/>
      <stop offset="1" stop-color="#D9F04A" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="panelClip">
      <rect width="1000" height="330" rx="3"/>
    </clipPath>

    <!-- Keeps the moving highlight inside the yellow accent -->
    <clipPath id="accentClip">
      <rect x="40" y="217" width="38" height="6"/>
    </clipPath>
  </defs>

  <style>
    .headline {
      animation: powerOn 1.1s steps(1,end) 1 both;
    }

    .artwork {
      transform-box: fill-box;
      transform-origin: center;
      animation: rotate 24s linear infinite;
    }

    .orbit-marker {
      transform-box: fill-box;
      transform-origin: center;
      animation: orbit 9s linear infinite;
    }

    .signal {
      animation: pulse 1.8s ease-in-out infinite;
    }

    .sweep {
      animation: sweepAcross 4s ease-in-out infinite;
    }

    .micro {
      animation: microBlink 3s steps(1,end) infinite;
    }

    @keyframes powerOn {
      0% { opacity:0; filter:brightness(0); }
      9% { opacity:1; filter:brightness(2); }
      16% { opacity:.12; filter:brightness(.5); }
      25% { opacity:1; filter:brightness(1.6); }
      33% { opacity:.4; filter:brightness(.7); }
      42% { opacity:1; filter:brightness(1.5); }
      55% { opacity:.7; filter:brightness(.9); }
      68%,100% { opacity:1; filter:brightness(1); }
    }

    @keyframes rotate {
      to { transform:rotate(360deg); }
    }

    @keyframes orbit {
      to { transform:rotate(360deg); }
    }

    @keyframes pulse {
      0%,100% { opacity:.45; }
      50% { opacity:1; }
    }

    @keyframes sweepAcross {
      0% { transform:translateX(-110px); opacity:0; }
      20% { opacity:1; }
      75% { opacity:1; }
      100% { transform:translateX(500px); opacity:0; }
    }

    @keyframes microBlink {
      0%,88%,100% { opacity:1; }
      90%,94% { opacity:.25; }
    }

    @media (prefers-reduced-motion: reduce) {
      .headline,.artwork,.orbit-marker,.signal,.sweep,.micro {
        animation:none;
      }
    }
  </style>

  <g clip-path="url(#panelClip)">
    <rect width="1000" height="330" fill="url(#panel)"/>
    <rect width="1000" height="330" fill="url(#grid)"/>

    <!-- Section header -->
    <text x="38" y="36" fill="#D9F04A" font-family="monospace" font-size="11" letter-spacing="2">001 / TRANSMISSION</text>
    <text x="962" y="36" fill="#777780" font-family="monospace" font-size="10" text-anchor="end" letter-spacing="1.5">PERSONAL PROFILE — 2026</text>
    <path d="M38 53H962" stroke="#E9E4D7" stroke-opacity=".2"/>

    <!-- One-time digital headline flicker -->
    <g class="headline">
      <text x="38" y="133" fill="#E9E4D7" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="900" letter-spacing="-3">A MIND IN</text>
      <text x="38" y="199" fill="#F15A3B" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="900" letter-spacing="-3">MOTION.</text>
    </g>

    <!-- Accent line and contained moving highlight -->
    <rect x="40" y="218" width="38" height="4" fill="#D9F04A"/>
    <g clip-path="url(#accentClip)">
      <rect class="sweep" x="40" y="217" width="65" height="6" fill="url(#sweep)"/>
    </g>

    <!-- Introduction -->
    <text x="40" y="253" fill="#E9E4D7" font-family="Arial, Helvetica, sans-serif" font-size="16">I'm Gopala Krishna — a BCA student,</text>
    <text x="40" y="277" fill="#E9E4D7" font-family="Arial, Helvetica, sans-serif" font-size="16">builder, and curious mind.</text>
    <text x="40" y="309" fill="#92919A" font-family="monospace" font-size="10" letter-spacing="1">EXPLORING TECHNOLOGY / BUILDING IDEAS / LEARNING BY DOING</text>

    <!-- Rotating geometric composition -->
    <g transform="translate(775 164)">
      <g class="artwork">
        <circle r="112" stroke="#E9E4D7" stroke-opacity=".13"/>
        <circle r="82" stroke="#E9E4D7" stroke-opacity=".18" stroke-dasharray="3 7"/>
        <circle r="49" stroke="#E9E4D7" stroke-opacity=".2"/>
        <path d="M-105 0H105M0 -105V105" stroke="#E9E4D7" stroke-opacity=".12"/>

        <g transform="rotate(-28)">
          <rect x="-35" y="-35" width="70" height="70" fill="url(#beam)"/>
          <rect x="-22" y="-22" width="44" height="44" fill="#17181D"/>
          <rect x="-9" y="-9" width="18" height="18" fill="#D9F04A"/>
        </g>
      </g>

      <!-- Orbiting markers -->
      <g class="orbit-marker">
        <circle cx="0" cy="-112" r="5" fill="#D9F04A"/>
      </g>

      <circle cx="112" cy="0" r="4" fill="#F15A3B"/>
      <rect x="-4" y="104" width="8" height="8" transform="rotate(45 0 108)" fill="#B88BEA"/>
      <circle cx="-112" cy="0" r="4" fill="#345CEB"/>

      <!-- Signal pulse -->
      <circle class="signal" r="8" fill="none" stroke="#D9F04A" stroke-width="1.5"/>
      <circle r="3" fill="#D9F04A"/>
    </g>

    <!-- Corner details -->
    <path d="M925 78H962V115" stroke="#D9F04A" stroke-width="2"/>
    <path d="M38 294V310H54" stroke="#F15A3B" stroke-width="2"/>

    <text x="962" y="314" fill="#777780" font-family="monospace" font-size="9" text-anchor="end">GK / 001</text>
    <text class="micro" x="870" y="72" fill="#D9F04A" font-family="monospace" font-size="8" letter-spacing="1">● SIGNAL ACTIVE</text>
  </g>
</svg>
